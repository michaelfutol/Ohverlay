<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Sky Lanterns & Calming Fireworks — Ambient Night</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('sky');
      const ctx = canvas.getContext('2d', { alpha: true });
      const query = new URLSearchParams(location.search);
      const globalScale = parseFloat(query.get('scale')) || 1.0;
      const TAU = Math.PI * 2;

      let width = 1;
      let height = 1;
      let pixelRatio = 1;
      let lastTime = performance.now();
      let elapsed = 0;

      // ── Timing Cycle: Every 20 minutes (1200 seconds) ──
      const CYCLE_INTERVAL = 20 * 60; // 20 minutes in seconds
      let cycleTimer = 0; // Starts at 0 to trigger immediately on launch!

      // Entities
      const lanterns = [];
      const rockets = [];
      const particles = [];
      const embers = [];

      function resize() {
        width = Math.max(1, window.innerWidth || document.documentElement.clientWidth);
        height = Math.max(1, window.innerHeight || document.documentElement.clientHeight);
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }
      window.addEventListener('resize', resize, { passive: true });
      resize();

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      // ══════════════════════════════════════════════════════
      // 🏮 SKY LANTERNS (Khom Loi)
      // ══════════════════════════════════════════════════════

      function createLantern(isDistant = false) {
        const z = isDistant ? rand(0.3, 0.6) : rand(0.7, 1.3);
        const baseWidth = rand(22, 34) * globalScale * z;
        const baseHeight = baseWidth * rand(1.25, 1.45);
        const startX = rand(width * 0.1, width * 0.9);
        const startY = height + rand(20, 100);

        // Color palettes: warm gold, soft peach, glowing amber, rose paper
        const palettes = [
          { top: 'rgba(255, 200, 110, ', flame: '#fffae0', glow: 'rgba(255, 170, 60, ' },
          { top: 'rgba(255, 175, 125, ', flame: '#fff4eb', glow: 'rgba(255, 140, 70, ' },
          { top: 'rgba(255, 225, 140, ', flame: '#fffff0', glow: 'rgba(255, 190, 80, ' },
          { top: 'rgba(255, 160, 140, ', flame: '#fff0eb', glow: 'rgba(255, 120, 90, ' }
        ];
        const palette = palettes[Math.floor(Math.random() * palettes.length)];

        return {
          x: startX,
          y: startY,
          vx: rand(-0.15, 0.25),
          vy: rand(-0.45, -0.75) * (0.8 + z * 0.3),
          z,
          w: baseWidth,
          h: baseHeight,
          palette,
          flickerSeed: rand(0, 100),
          swayPhase: rand(0, TAU),
          swaySpeed: rand(0.8, 1.5),
          swayAmp: rand(12, 28) * z,
          tilt: 0,
          opacity: rand(0.75, 0.95),
          life: 0,
          maxLife: rand(55, 80),
          dead: false
        };
      }

      function launchLanternFlock(count = 14) {
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            lanterns.push(createLantern(Math.random() < 0.4));
          }, i * rand(400, 1200));
        }
      }

      function updateLanterns(dt) {
        for (let i = lanterns.length - 1; i >= 0; i--) {
          const l = lanterns[i];
          l.life += dt;

          // Gentle horizontal breeze & sway
          const sway = Math.sin(l.life * l.swaySpeed + l.swayPhase) * l.swayAmp;
          l.x += (l.vx + sway * 0.03) * dt * 60;
          l.y += l.vy * dt * 60;

          // Subtle tilt in the wind
          l.tilt = Math.sin(l.life * l.swaySpeed + l.swayPhase) * 0.08;

          // As it climbs higher into the night sky, it gently diminishes
          if (l.y < height * 0.4) {
            l.w = Math.max(8, l.w - dt * 0.8);
            l.h = Math.max(10, l.h - dt * 1.0);
          }

          // Fade out near top of screen
          if (l.y < -l.h * 2 || l.life > l.maxLife) {
            lanterns.splice(i, 1);
          }
        }
      }

      function drawLanterns() {
        for (const l of lanterns) {
          ctx.save();
          ctx.translate(l.x, l.y);
          ctx.rotate(l.tilt);

          const flicker = Math.sin(elapsed * 6 + l.flickerSeed) * 0.12 + Math.cos(elapsed * 11 + l.flickerSeed * 2) * 0.08;
          const currentAlpha = Math.max(0, Math.min(1, l.opacity + flicker));

          // 1. Soft Outer Atmospheric Bloom
          const glowGrad = ctx.createRadialGradient(0, l.h * 0.4, 0, 0, l.h * 0.4, l.w * 2.2);
          glowGrad.addColorStop(0, l.palette.glow + (0.35 * currentAlpha) + ')');
          glowGrad.addColorStop(0.4, l.palette.glow + (0.12 * currentAlpha) + ')');
          glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

          ctx.fillStyle = glowGrad;
          ctx.beginPath();
          ctx.arc(0, l.h * 0.4, l.w * 2.2, 0, TAU);
          ctx.fill();

          // 2. Translucent Paper Lantern Body (Rounded Trapezoid)
          const hw = l.w * 0.5;
          const topHw = hw * 0.78;
          const bottomHw = hw * 0.95;

          const bodyGrad = ctx.createLinearGradient(0, -l.h * 0.5, 0, l.h * 0.5);
          bodyGrad.addColorStop(0, l.palette.top + (0.75 * currentAlpha) + ')');
          bodyGrad.addColorStop(0.65, l.palette.glow + (0.90 * currentAlpha) + ')');
          bodyGrad.addColorStop(1, l.palette.top + (0.85 * currentAlpha) + ')');

          ctx.beginPath();
          ctx.moveTo(-topHw, -l.h * 0.5);
          ctx.quadraticCurveTo(0, -l.h * 0.58, topHw, -l.h * 0.5);
          ctx.lineTo(bottomHw, l.h * 0.45);
          ctx.quadraticCurveTo(0, l.h * 0.52, -bottomHw, l.h * 0.45);
          ctx.closePath();

          ctx.fillStyle = bodyGrad;
          ctx.fill();

          // Delicate bamboo collar wire at bottom
          ctx.strokeStyle = 'rgba(90, 55, 25, ' + (0.6 * currentAlpha) + ')';
          ctx.lineWidth = Math.max(0.7, 1.2 * globalScale);
          ctx.beginPath();
          ctx.ellipse(0, l.h * 0.45, bottomHw, l.h * 0.08, 0, 0, TAU);
          ctx.stroke();

          // 3. Inner Flickering Core Flame
          const flameY = l.h * 0.38;
          const flameSize = Math.max(2, l.w * 0.22 * (1 + flicker * 0.5));
          const flameGrad = ctx.createRadialGradient(0, flameY, 0, 0, flameY, flameSize * 2.5);
          flameGrad.addColorStop(0, '#ffffff');
          flameGrad.addColorStop(0.3, l.palette.flame);
          flameGrad.addColorStop(0.7, l.palette.glow + (0.8 * currentAlpha) + ')');
          flameGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

          ctx.fillStyle = flameGrad;
          ctx.beginPath();
          ctx.arc(0, flameY, flameSize * 2.5, 0, TAU);
          ctx.fill();

          ctx.restore();
        }
      }

      // ══════════════════════════════════════════════════════
      // 🎆 CALMING SOFT FIREWORKS (Hanabi / Golden Willow)
      // ══════════════════════════════════════════════════════

      // Serene, tranquil color schemes: Golden Kamuro Willow, Soft Peony (Rose/Lilac), Moonlight Aqua
      const FIREWORK_PALETTES = [
        // Golden Kamuro Willow (Warm luxury gold)
        {
          name: 'willow_gold',
          colors: ['#fff4db', '#ffe6a8', '#ffd270', '#e8b04a', '#c78f2e'],
          trail: 'rgba(255, 215, 120, ',
          willow: true,
          sparkle: true
        },
        // Serene Lavender Peony
        {
          name: 'lavender_dream',
          colors: ['#ffffff', '#f4e4ff', '#dfb8ff', '#be85ff', '#9355e8'],
          trail: 'rgba(215, 175, 255, ',
          willow: false,
          sparkle: true
        },
        // Sakura Pink Chrysanthemum
        {
          name: 'sakura_bloom',
          colors: ['#ffffff', '#ffe4ed', '#ffb0cb', '#ff78a4', '#e04a7a'],
          trail: 'rgba(255, 170, 195, ',
          willow: false,
          sparkle: true
        },
        // Moonlight Aqua & Mint
        {
          name: 'moonlight_aqua',
          colors: ['#ffffff', '#e0ffff', '#a8f7ec', '#62dfcf', '#38b2a3'],
          trail: 'rgba(150, 245, 235, ',
          willow: false,
          sparkle: true
        }
      ];

      function launchCalmingRocket() {
        const startX = rand(width * 0.15, width * 0.85);
        const targetY = rand(height * 0.15, height * 0.42);
        const palette = FIREWORK_PALETTES[Math.floor(Math.random() * FIREWORK_PALETTES.length)];

        rockets.push({
          x: startX,
          y: height + 20,
          targetY,
          vx: rand(-0.35, 0.35),
          vy: rand(-8.5, -11.5) * Math.sqrt(height / 800),
          palette,
          trail: [],
          color: palette.colors[0],
          dead: false
        });
      }

      function explodeFirework(x, y, palette) {
        const count = palette.willow ? Math.floor(rand(55, 80)) : Math.floor(rand(60, 95));
        const baseSpeed = rand(2.2, 3.8) * globalScale;

        // Flash halo (soft, not harsh)
        embers.push({
          x,
          y,
          radius: rand(45, 80) * globalScale,
          color: palette.colors[0],
          alpha: 0.35,
          decay: 0.04
        });

        for (let i = 0; i < count; i++) {
          const angle = (i / count) * TAU + rand(-0.06, 0.06);
          const speed = baseSpeed * rand(0.55, 1.15);
          const color = palette.colors[Math.floor(Math.random() * palette.colors.length)];

          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            history: [],
            color,
            palette,
            willow: palette.willow,
            alpha: 1.0,
            decay: palette.willow ? rand(0.007, 0.012) : rand(0.012, 0.020),
            gravity: palette.willow ? 0.042 : 0.032,
            friction: palette.willow ? 0.978 : 0.965,
            sparkle: palette.sparkle && Math.random() < 0.65,
            sparkleSeed: rand(0, 100),
            size: rand(1.2, 2.2) * globalScale
          });
        }
      }

      function launchFireworkShow(sequenceCount = 7) {
        for (let i = 0; i < sequenceCount; i++) {
          setTimeout(() => {
            launchCalmingRocket();
          }, i * rand(1800, 3200));
        }
      }

      function updateFireworks(dt) {
        // 1. Update Rockets
        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          r.x += r.vx;
          r.y += r.vy;
          r.vy += 0.08; // slight drag

          r.trail.push({ x: r.x, y: r.y, alpha: 0.8 });
          if (r.trail.length > 12) r.trail.shift();

          for (const t of r.trail) t.alpha -= 0.05;

          if (r.y <= r.targetY || r.vy >= -0.5) {
            explodeFirework(r.x, r.y, r.palette);
            rockets.splice(i, 1);
          }
        }

        // 2. Update Particles (Explosions)
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.history.push({ x: p.x, y: p.y, alpha: p.alpha });
          if (p.history.length > (p.willow ? 16 : 8)) p.history.shift();

          p.vx *= p.friction;
          p.vy *= p.friction;
          p.vy += p.gravity;

          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= p.decay;

          for (const h of p.history) h.alpha -= p.decay * 1.1;

          if (p.alpha <= 0) {
            particles.splice(i, 1);
          }
        }

        // 3. Update Soft Embers / Ambient Halos
        for (let i = embers.length - 1; i >= 0; i--) {
          const e = embers[i];
          e.alpha -= e.decay;
          e.radius += 0.8;
          if (e.alpha <= 0) {
            embers.splice(i, 1);
          }
        }
      }

      function drawFireworks() {
        // Draw Soft Halos
        for (const e of embers) {
          const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.radius);
          grad.addColorStop(0, 'rgba(255, 240, 200, ' + e.alpha + ')');
          grad.addColorStop(0.5, 'rgba(255, 200, 120, ' + (e.alpha * 0.4) + ')');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius, 0, TAU);
          ctx.fill();
        }

        // Draw Rising Rockets
        for (const r of rockets) {
          ctx.strokeStyle = r.palette.trail + '0.7)';
          ctx.lineWidth = 1.6 * globalScale;
          ctx.beginPath();
          for (let i = 0; i < r.trail.length; i++) {
            const pt = r.trail[i];
            if (i === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          }
          ctx.stroke();

          // Rocket head spark
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(r.x, r.y, 2.2 * globalScale, 0, TAU);
          ctx.fill();
        }

        // Draw Blooming Firework Particles & Sparkling Willows
        for (const p of particles) {
          if (p.alpha <= 0) continue;

          // Trail Line
          if (p.history.length > 1) {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = p.size;
            ctx.beginPath();
            for (let i = 0; i < p.history.length; i++) {
              const h = p.history[i];
              if (i === 0) ctx.moveTo(h.x, h.y);
              else ctx.lineTo(h.x, h.y);
            }
            ctx.stroke();
          }

          // Sparkling Head
          let sparkleMod = 1.0;
          if (p.sparkle) {
            sparkleMod = (Math.sin(elapsed * 25 + p.sparkleSeed) + 1.0) * 0.5;
          }

          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.alpha * sparkleMod);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (p.sparkle ? 1.4 : 1.0), 0, TAU);
          ctx.fill();
          ctx.globalAlpha = 1.0;
        }
      }

      // ══════════════════════════════════════════════════════
      // 🔄 EPISODIC 20-MINUTE SEQUENCE CONTROLLER
      // ══════════════════════════════════════════════════════

      function startSequence() {
        // Stage 1: Floating Sky Lanterns first (0s to 35s)
        launchLanternFlock(16);

        // Stage 2: Calming Fireworks follow smoothly after 28 seconds (as lanterns reach the high sky)
        setTimeout(() => {
          launchFireworkShow(8);
        }, 28000);
      }

      // Trigger immediately on initial load!
      startSequence();

      function updateSequence(dt) {
        cycleTimer += dt;
        if (cycleTimer >= CYCLE_INTERVAL) {
          cycleTimer = 0;
          startSequence();
        }
      }

      // Keyboard trigger for manual preview ('Space' or 'L' or 'F')
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key.toLowerCase() === 'l' || e.key.toLowerCase() === 'f') {
          startSequence();
        }
      });

      // ── Main Animation Loop ──
      function frame(now) {
        if (width !== window.innerWidth || height !== window.innerHeight) {
          resize();
        }

        const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;
        elapsed += dt;

        updateSequence(dt);
        updateLanterns(dt);
        updateFireworks(dt);

        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        ctx.clearRect(0, 0, width, height);

        // Render layers: Lanterns in the atmospheric background & fireworks gracefully illuminating
        drawLanterns();
        drawFireworks();

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
