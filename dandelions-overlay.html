      const REFERENCE_FILAMENTS = [{"c1":[-10.48,-3.83],"c2":[-35.67,-7.79],"e":[-50.7,-12.09],"a":0.5,"w":0.29,"p":0.0,"k":0.7},{"c1":[-10.36,-4.34],"c2":[-36.97,-6.58],"e":[-50.7,-14.43],"a":0.87,"w":0.31,"p":2.4,"k":0.99},{"c1":[-9.0,-4.69],"c2":[-30.85,-11.19],"e":[-44.07,-15.99],"a":0.83,"w":0.33,"p":4.8,"k":0.94},{"c1":[-11.12,-6.06],"c2":[-42.46,-7.81],"e":[-50.7,-22.23],"a":0.79,"w":0.35,"p":0.917,"k":0.89},{"c1":[-10.52,-6.4],"c2":[-38.82,-11.91],"e":[-50.7,-23.79],"a":0.75,"w":0.37,"p":3.317,"k":0.84},{"c1":[-8.26,-6.4],"c2":[-26.14,-17.75],"e":[-38.22,-23.79],"a":0.71,"w":0.39,"p":5.717,"k":0.79},{"c1":[-8.24,-7.26],"c2":[-34.09,-14.64],"e":[-41.34,-27.69],"a":0.67,"w":0.41,"p":1.834,"k":0.74},{"c1":[-9.61,-7.69],"c2":[-47.01,-14.98],"e":[-42.12,-29.64],"a":0.63,"w":0.43,"p":4.234,"k":1.03},{"c1":[-9.24,-8.72],"c2":[-41.53,-17.71],"e":[-44.85,-34.32],"a":0.59,"w":0.45,"p":0.351,"k":0.98},{"c1":[-8.49,-8.12],"c2":[-27.56,-22.13],"e":[-39.39,-31.59],"a":0.55,"w":0.3,"p":2.751,"k":0.93},{"c1":[-8.55,-8.29],"c2":[-29.89,-19.87],"e":[-38.22,-32.37],"a":0.51,"w":0.32,"p":5.151,"k":0.88},{"c1":[-9.26,-8.72],"c2":[-29.38,-21.7],"e":[-38.22,-34.32],"a":0.88,"w":0.34,"p":1.268,"k":0.83},{"c1":[-7.33,-8.98],"c2":[-27.26,-23.41],"e":[-36.66,-35.49],"a":0.84,"w":0.36,"p":3.668,"k":0.78},{"c1":[-6.45,-9.49],"c2":[-29.13,-23.25],"e":[-32.37,-37.83],"a":0.8,"w":0.38,"p":6.068,"k":0.73},{"c1":[-4.64,-7.43],"c2":[-23.4,-17.41],"e":[-23.4,-28.47],"a":0.76,"w":0.4,"p":2.184,"k":1.02},{"c1":[-5.82,-7.52],"c2":[-11.62,-28.86],"e":[-22.62,-28.86],"a":0.72,"w":0.42,"p":4.584,"k":0.97},{"c1":[-5.98,-10.26],"c2":[-23.61,-27.23],"e":[-29.25,-41.34],"a":0.68,"w":0.44,"p":0.701,"k":0.92},{"c1":[-4.73,-10.01],"c2":[-22.56,-26.2],"e":[-25.35,-40.17],"a":0.64,"w":0.29,"p":3.101,"k":0.87},{"c1":[-6.13,-11.21],"c2":[-26.91,-29.74],"e":[-26.91,-45.63],"a":0.6,"w":0.31,"p":5.501,"k":0.82},{"c1":[-4.0,-8.46],"c2":[-15.06,-22.27],"e":[-18.33,-33.15],"a":0.56,"w":0.33,"p":1.618,"k":0.77},{"c1"       function getSeedPaletteKey(index) {
        if (currentStyle === 'mix' || currentStyle === 'random') {
          const keys = ['cyan', 'violet', 'emerald'];
          return keys[index % keys.length];
        }
        return currentStyle in PALETTES ? currentStyle : 'cyan';
      }

      let width = 1;
      let height = 1;
      let dpr = 1;
      let elapsed = 0;
      let lastTime = performance.now();
      let paused = false;
      let globalGust = 0;
      let fitScale = 1;
      let seeds = [];
      let spores = [];
      const MAX_SPORES = 160;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, amount) {
        return a + (b - a) * amount;
      }

      function spawnSpore(x, y, vx, vy, colorRgb, size = 1.8, maxLife = 3.2) {
        if (spores.length >= MAX_SPORES) spores.shift();
        spores.push({
          x, y,
          vx: vx + (Math.random() - 0.5) * 8,
          vy: vy + (Math.random() - 0.5) * 8 - 2.5,
          life: 0,
          maxLife,
          size: size * (0.7 + Math.random() * 0.6),
          colorRgb,
          twinklePhase: Math.random() * Math.PI * 2
        });
      }

      function updateSpores(dt) {
        for (let i = spores.length - 1; i >= 0; i--) {
          const s = spores[i];
          s.life += dt;
          if (s.life >= s.maxLife) {
            spores.splice(i, 1);
            continue;
          }
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          s.vx *= Math.exp(-0.85 * dt);
          s.vy *= Math.exp(-0.85 * dt);
          s.vy -= 1.8 * dt;
        }
      }

      function drawSpores() {
        for (const s of spores) {
          const progress = s.life / s.maxLife;
          const fade = Math.sin(progress * Math.PI);
          const twinkle = 0.75 + 0.25 * Math.sin(elapsed * 6.5 + s.twinklePhase);
          const a = Math.max(0, fade * twinkle * 0.88);
          if (a < 0.01) continue;

          ctx.fillStyle = `rgba(${s.colorRgb[0]}, ${s.colorRgb[1]}, ${s.colorRgb[2]}, ${a.toFixed(3)})`;
          ctx.shadowColor = `rgba(${s.colorRgb[0]}, ${s.colorRgb[1]}, ${s.colorRgb[2]}, ${(a * 0.85).toFixed(3)})`;
          ctx.shadowBlur = s.size * 3.6;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size * (1.0 - progress * 0.25), 0, TAU);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }

      function makeSeed(x, y, vx, vy, phase, size, angle, flipX = 1, paletteKey = 'cyan') {
        const variation = Math.random();
        return {
          x, y, vx, vy, phase, size, angle, variation, flipX, paletteKey,
          flare: 0,
          angularVelocity: 0,
          filaments: REFERENCE_FILAMENTS.map((source, index) => {
            const scale = 0.85 + (variation * 0.3) + (Math.sin(index * 1.7 + phase) * 0.15);
            return {
              ...source,
              e: [source.e[0] * scale, source.e[1] * scale],
              c1: [source.c1[0] * scale, source.c1[1] * scale],
              c2: [source.c2[0] * scale, source.c2[1] * scale],
              depth: Math.sin(source.p + phase * 0.19),
              deflection: 0,
              deflectionVelocity: 0,
              index
            };
          })
        };
      }

      function seedScale(seed) {
        return UNIT * fitScale * seed.size;
      }

      function createSeeds() {
        seeds = [];
        for (let i = 0; i < DANDELION_COUNT; i++) {
          const rx = 0.12 + (i / Math.max(1, DANDELION_COUNT - 1)) * 0.76;
          const ry = 0.15 + (i % 3) * 0.25;
          const vx = (Math.random() - 0.5) * 8.0;
          const vy = 3.2 + Math.random() * 2.0;
          const phase = i * 2.1 + Math.random() * 3.0;
          const size = 0.82 + (Math.random() * 0.28);
          const flipX = (i % 2 === 1) ? -1 : 1;
          const angle = (Math.random() - 0.5) * 0.35;
          const paletteKey = getSeedPaletteKey(i);
          seeds.push(makeSeed(width * rx, height * ry, vx, vy, phase, size, angle, flipX, paletteKey));
        }
        for (const seed of seeds) constrainSeed(seed);
      }

      function updateSeedPalettes() {
        seeds.forEach((seed, index) => {
          seed.paletteKey = getSeedPaletteKey(index);
        });
      }

      window.__setDandelionStyle = function(style) {
        currentStyle = (style || 'cyan').toLowerCase();
        updateSeedPalettes();
      };

      function resize() {
        const oldWidth = width || innerWidth;
        const oldHeight = height || innerHeight;
        const positions = seeds.map(seed => [seed.x / oldWidth, seed.y / oldHeight]);

        width = Math.max(1, innerWidth);
        height = Math.max(1, innerHeight);
        dpr = Math.min(devicePixelRatio || 1, 2.5);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        fitScale = Math.min(1, width / 620, height / 480);

        if (!seeds.length) {
          createSeeds();
        } else {
          seeds.forEach((seed, index) => {
            seed.x = positions[index][0] * width;
            seed.y = positions[index][1] * height;
            constrainSeed(seed);
          });
        }
      }

      function reset() {
        elapsed = 0;
        globalGust = 0;
        spores = [];
        createSeeds();
      }

      function extents(seed) {
        const s = seedScale(seed);
        return { x: 56 * s, top: 52 * s, bottom: 102 * s };
      }

      function constrainSeed(seed) {
        const e = extents(seed);
        seed.x = clamp(seed.x, e.x, width - e.x);
        seed.y = clamp(seed.y, e.top, height - e.bottom);
      }

      function airAt(seed) {
        const nx = seed.x / Math.max(width, 1);
        const ny = seed.y / Math.max(height, 1);
        const t = elapsed + seed.phase;
        return {
          x:
            7.6 * Math.sin(t * 0.31 + ny * 5.4) +
            4.1 * Math.sin(t * 0.79 - nx * 6.0 + seed.phase) +
            1.7 * Math.sin(t * 1.53 + nx * 3.1),
          y:
            4.2 * Math.sin(t * 0.27 + nx * 5.0 + 0.5) +
            2.3 * Math.sin(t * 0.89 + ny * 6.7 + seed.phase) +
            1.1 * Math.sin(t * 1.47 - nx * 2.6)
        };
      }

      function updateSeed(seed, dt) {
        const air = airAt(seed);
        const gust = globalGust * (0.80 + 0.20 * Math.sin(elapsed * 3.8 + seed.phase));
        const personalDrift = Math.sin(seed.phase * 1.9) * 3.2;
        const desiredVx = personalDrift + air.x + gust;
        const desiredVy = 5.8 + air.y;
        const response = 1 - Math.exp(-0.82 * dt);

        seed.vx += (desiredVx - seed.vx) * response;
        seed.vy += (desiredVy - seed.vy) * response;

        const thermal = Math.max(0, Math.sin(elapsed * 0.21 + seed.phase + seed.x / Math.max(width, 1) * 5.1));
        seed.vy -= thermal * 4.3 * dt;

        const e = extents(seed);
        const edgeBand = Math.max(84, Math.min(width, height) * 0.13);
        const left = seed.x - e.x;
        const right = width - e.x - seed.x;
        const top = seed.y - e.top;
        const bottom = height - e.bottom - seed.y;

        if (left < edgeBand) seed.vx += 34 * (1 - left / edgeBand) * dt;
        if (right < edgeBand) seed.vx -= 38 * (1 - right / edgeBand) * dt;
        if (top < edgeBand) seed.vy += 31 * (1 - top / edgeBand) * dt;
        if (bottom < edgeBand) seed.vy -= 38 * (1 - bottom / edgeBand) * dt;

        seed.x += seed.vx * dt;
        seed.y += seed.vy * dt;

        const targetAngle = clamp(seed.vx * 0.0102, -0.45, 0.45);
        const torque = (targetAngle - seed.angle) * 1.12 - seed.angularVelocity * 1.60;
        seed.angularVelocity += torque * dt;
        seed.angle += seed.angularVelocity * dt;

        const localWind = clamp((air.x + gust) / 34, -1.25, 1.25);
        for (const filament of seed.filaments) {
          const microEddy =
            Math.sin(elapsed * (1.30 + filament.k * 0.43) + filament.p + seed.phase) *
            0.010;
          const target = localWind * 0.070 * filament.k + microEddy;
          const stiffness = 10.5 + filament.k * 5.8;
          const damping = 2 * Math.sqrt(stiffness) * 0.82;
          filament.deflectionVelocity +=
            ((target - filament.deflection) * stiffness -
              filament.deflectionVelocity * damping) *
            dt;
          filament.deflection += filament.deflectionVelocity * dt;
        }

        // Decay flare
        seed.flare = Math.max(0, (seed.flare || 0) * Math.exp(-2.2 * dt));

        // Spore emission from drifting filaments
        const pal = PALETTES[seed.paletteKey] || PALETTES.cyan;
        if (pal.isBio && Math.random() < 0.28) {
          const f = seed.filaments[Math.floor(Math.random() * seed.filaments.length)];
          const tip = deformPoint(f.e, 1, f);
          const s = seedScale(seed);
          const cos = Math.cos(seed.angle), sin = Math.sin(seed.angle);
          const flip = seed.flipX || 1;
          const lx = tip[0] * s * flip, ly = tip[1] * s;
          const wx = seed.x + lx * cos - ly * sin;
          const wy = seed.y + lx * sin + ly * cos;
          spawnSpore(wx, wy, seed.vx * 0.35, seed.vy * 0.35, pal.sporeColor, 1.6, 2.8 + Math.random() * 2.0);
        }

        constrainSeed(seed);
      }

      function separateSeeds(dt) {
        for (let i = 0; i < seeds.length; i++) {
          for (let j = i + 1; j < seeds.length; j++) {
            const a = seeds[i];
            const b = seeds[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const distance = Math.max(1, Math.hypot(dx, dy));
            const comfort = 104 * UNIT * fitScale;
            if (distance < comfort) {
              const push = (1 - distance / comfort) * 5.5 * dt;
              const nx = dx / distance;
              const ny = dy / distance;
              a.vx -= nx * push;
              a.vy -= ny * push;
              b.vx += nx * push;
              b.vy += ny * push;
            }
          }
        }
      }

      let lastBreezeTime = 0;
      const BREEZE_INTERVAL_SEC = 20 * 60; // 20 minutes

      function update(dt) {
        elapsed += dt;
        globalGust *= Math.exp(-1.65 * dt);
        
        // Gentle breeze every 20 minutes (plus initial welcome breeze at 3s)
        if (elapsed - lastBreezeTime >= BREEZE_INTERVAL_SEC || (lastBreezeTime === 0 && elapsed > 3.0)) {
          lastBreezeTime = elapsed;
          globalGust += (Math.random() > 0.5 ? 1 : -1) * (180 + Math.random() * 120);
          for (const s of seeds) s.flare = 0.85;
        }

        for (const seed of seeds) updateSeed(seed, dt);
        updateSpores(dt);
        separateSeeds(dt);
      }

      function deformPoint(point, fraction, filament) {
        const angle = filament.deflection * Math.pow(fraction, 1.72);
        const cosine = Math.cos(angle);
        const sine = Math.sin(angle);
        const x = point[0] * cosine - point[1] * sine;
        const y = point[0] * sine + point[1] * cosine;
        const ripple =
          Math.sin(elapsed * 2.0 + filament.p + fraction * 1.8) *
          0.34 *
          fraction *
          filament.k;
        return [x, y + ripple];
      }

      function drawFilament(filament, index, pal, lum) {
        const c1 = deformPoint(filament.c1, 0.30, filament);
        const c2 = deformPoint(filament.c2, 0.66, filament);
        const tip = deformPoint(filament.e, 1, filament);
        const frontFactor = 0.76 + (filament.depth + 1) * 0.12;
        const alpha = Math.min(1.0, filament.a * frontFactor * lum);

        if (pal.isBio) {
          ctx.shadowColor = `rgba(${pal.glowRgb}, 0.85)`;
          ctx.shadowBlur = 5.5 * lum;
          ctx.strokeStyle = pal.halo(alpha);
          ctx.lineWidth = filament.w * 2.4;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], tip[0], tip[1]);
          ctx.stroke();

          ctx.strokeStyle = pal.core(alpha);
          ctx.lineWidth = filament.w;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], tip[0], tip[1]);
          ctx.stroke();
        } else {
          ctx.shadowBlur = 0;
          ctx.strokeStyle = pal.core(alpha);
          ctx.lineWidth = filament.w;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], tip[0], tip[1]);
          ctx.stroke();
        }

        if (Math.sin(filament.p * 2.7 + index) > 0.18) {
          const baseX = lerp(c2[0], tip[0], 0.50);
          const baseY = lerp(c2[1], tip[1], 0.50);
          const length = Math.max(1, Math.hypot(tip[0], tip[1]));
          const normalX = -tip[1] / length;
          const normalY = tip[0] / length;
          ctx.strokeStyle = pal.barb(alpha);
          ctx.lineWidth = 0.30;
          ctx.beginPath();
          ctx.moveTo(baseX, baseY);
          ctx.lineTo(baseX + normalX * 1.55, baseY + normalY * 1.55);
          ctx.moveTo(baseX, baseY);
          ctx.lineTo(baseX - normalX * 1.2, baseY - normalY * 1.2);
          ctx.stroke();
        }
      }

      function drawAchene(pal, lum) {
        const bodyGradient = ctx.createLinearGradient(-2.2, 71, 2.4, 94);
        bodyGradient.addColorStop(0, pal.acheneGrad[0]);
        bodyGradient.addColorStop(0.28, pal.acheneGrad[1]);
        bodyGradient.addColorStop(0.55, pal.acheneGrad[2]);
        bodyGradient.addColorStop(0.80, pal.acheneGrad[3]);
        bodyGradient.addColorStop(1, pal.acheneGrad[4]);
        ctx.fillStyle = bodyGradient;
        if (pal.isBio) {
          ctx.shadowColor = `rgba(${pal.glowRgb}, 0.70)`;
          ctx.shadowBlur = 7 * lum;
        } else {
          ctx.shadowBlur = 0;
        }
        ctx.beginPath();
        ctx.moveTo(0.05, 71.0);
        ctx.bezierCurveTo(1.85, 72.7, 2.35, 77.6, 2.05, 83.3);
        ctx.bezierCurveTo(1.8, 88.2, 0.95, 93.4, 0.15, 96.1);
        ctx.bezierCurveTo(-0.45, 97.5, -1.05, 97.4, -1.55, 95.9);
        ctx.bezierCurveTo(-2.55, 91.8, -2.65, 84.0, -2.25, 78.2);
        ctx.bezierCurveTo(-1.95, 74.1, -1.0, 71.7, 0.05, 71.0);
        ctx.fill();

        ctx.strokeStyle = pal.acheneRib;
        ctx.lineWidth = pal.isBio ? 0.40 : 0.30;
        for (let rib = -1; rib <= 1; rib++) {
          const x = rib * 0.82;
          ctx.beginPath();
          ctx.moveTo(x * 0.30, 73.0);
          ctx.bezierCurveTo(x * 0.82, 79.2, x, 88.1, x * 0.34, 94.8);
          ctx.stroke();
        }

        ctx.fillStyle = pal.acheneTip;
        ctx.beginPath();
        ctx.moveTo(-0.55, 95.4);
        ctx.lineTo(0, 98.2);
        ctx.lineTo(0.52, 95.4);
        ctx.closePath();
        ctx.fill();
      }

      function drawSeed(seed) {
        ctx.save();
        ctx.translate(seed.x, seed.y);
        ctx.rotate(seed.angle);
        const scale = seedScale(seed);
        ctx.scale(scale * (seed.flipX || 1), scale);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const pal = PALETTES[seed.paletteKey] || PALETTES.cyan;
        const pulse = 0.82 + 0.18 * Math.sin(elapsed * 2.2 + seed.phase);
        const lum = Math.min(1.6, pulse + (seed.flare || 0) * 0.7);

        for (let i = 0; i < seed.filaments.length; i++) {
          if (seed.filaments[i].depth <= 0) drawFilament(seed.filaments[i], i, pal, lum);
        }

        // Beak (stem)
        const beakGradient = ctx.createLinearGradient(0, 0, 0, 72);
        beakGradient.addColorStop(0, pal.beakStart);
        beakGradient.addColorStop(0.38, pal.beakMid);
        beakGradient.addColorStop(1, pal.beakEnd);
        ctx.strokeStyle = beakGradient;
        ctx.lineWidth = pal.isBio ? 0.65 : 0.48;
        if (pal.isBio) {
          ctx.shadowColor = `rgba(${pal.glowRgb}, 0.75)`;
          ctx.shadowBlur = 5 * lum;
        }
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-0.34, 19, 0.42, 46, 0, 71.4);
        ctx.stroke();

        // Hub (crown core)
        if (pal.isBio) {
          ctx.shadowColor = `rgba(${pal.glowRgb}, 0.90)`;
          ctx.shadowBlur = 10 * lum;
          const hubHalo = ctx.createRadialGradient(0, 0, 0.2, 0, 0, 3.8);
          hubHalo.addColorStop(0, `rgba(${pal.coreRgb}, 0.95)`);
          hubHalo.addColorStop(0.42, `rgba(${pal.glowRgb}, 0.70)`);
          hubHalo.addColorStop(1, `rgba(${pal.glowRgb}, 0.0)`);
          ctx.fillStyle = hubHalo;
          ctx.beginPath();
          ctx.ellipse(0, 0, 3.6, 2.5, 0, 0, TAU);
          ctx.fill();
        }
        const hubGradient = ctx.createRadialGradient(-0.35, -0.6, 0.15, 0, 0, 2);
        hubGradient.addColorStop(0, pal.hubInner);
        hubGradient.addColorStop(0.62, pal.hubMid);
        hubGradient.addColorStop(1, pal.hubOuter);
        ctx.fillStyle = hubGradient;
        ctx.beginPath();
        ctx.ellipse(0, 0, 1.7, 1.15, 0, 0, TAU);
        ctx.fill();

        for (let i = 0; i < seed.filaments.length; i++) {
          if (seed.filaments[i].depth > 0) drawFilament(seed.filaments[i], i, pal, lum);
        }

        drawAchene(pal, lum);
        ctx.restore();
      }

      function draw() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        drawSpores();
        const ordered = [...seeds].sort((a, b) => a.size - b.size);
        for (const seed of ordered) drawSeed(seed);
      }

      function frame(now) {
        if (width !== innerWidth || height !== innerHeight) resize();
        const dt = Math.min(0.033, Math.max(0, (now - lastTime) / 1000));
        lastTime = now;
        if (!paused) update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      addEventListener('resize', resize, { passive: true });
      addEventListener('keydown', event => {
        const key = event.key.toLowerCase();
        if (event.code === 'Space') {
          paused = !paused;
          event.preventDefault();
        } else if (key === 'g') {
          globalGust = Math.max(globalGust, 24);
          for (const s of seeds) s.flare = 0.85;
        } else if (key === 'r') {
          reset();
        } else if (key === 'f') {
          document.documentElement.requestFullscreen?.();
        }
      });

      addEventListener('pointerdown', event => {
        for (const seed of seeds) {
          const dx = seed.x - event.clientX;
          const dy = seed.y - event.clientY;
          const distance = Math.max(60, Math.hypot(dx, dy));
          seed.vx += (dx / distance) * 22;
          seed.vy += (dy / distance) * 15;
          seed.flare = 1.0;
          const pal = PALETTES[seed.paletteKey] || PALETTES.cyan;
          if (pal.isBio) {
            for (let k = 0; k < 12; k++) {
              const f = seed.filaments[Math.floor(Math.random() * seed.filaments.length)];
              const tip = deformPoint(f.e, 1, f);
              const s = seedScale(seed);
              const cos = Math.cos(seed.angle), sin = Math.sin(seed.angle);
              const flip = seed.flipX || 1;
              const lx = tip[0] * s * flip, ly = tip[1] * s;
              const wx = seed.x + lx * cos - ly * sin;
              const wy = seed.y + lx * sin + ly * cos;
              spawnSpore(wx, wy, seed.vx + (Math.random() - 0.5) * 35, seed.vy + (Math.random() - 0.5) * 35, pal.sporeColor, 2.2, 3.2 + Math.random() * 2.0);
            }
          }
        }
        globalGust = Math.max(globalGust, 22);
      }, { passive: true });

      resize();
      reset();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
