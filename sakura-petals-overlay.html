<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Cherry Blossom Petals — Ground Accumulation & Wind Physics</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
      const TAU = Math.PI * 2;

      let width = 1, height = 1, pixelRatio = 1;
      let elapsed = 0, lastTime = performance.now();
      let overlayScale = 1.0;
      let targetCount = 8;

      // 5-Minute Periodic Wind Gust State
      let windTimer = 0;
      const WIND_INTERVAL = 300; // 5 minutes in seconds (300s)
      let globalWindImpulse = 0;
      let windDirection = 1; // +1 = Left-to-Right, -1 = Right-to-Left

      function parseParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const scaleParam = parseFloat(urlParams.get('scale'));
        if (!isNaN(scaleParam) && scaleParam > 0) overlayScale = scaleParam;
        const countParam = parseInt(urlParams.get('count'), 10);
        if (!isNaN(countParam) && countParam > 0) targetCount = countParam;
      }
      parseParams();

      function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function pseudoRandom(seed, salt = 0) {
        const x = Math.sin(seed * 127.1 + salt * 311.7) * 43758.5453123;
        return x - Math.floor(x);
      }

      function resize() {
        width = Math.max(1, window.innerWidth);
        height = Math.max(1, window.innerHeight);
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      const PETAL_PALETTES = [
        { tip: 'rgba(255, 240, 245, 0.90)', body: 'rgba(255, 183, 198, 0.80)', base: 'rgba(215, 65, 110, 0.85)', vein: 'rgba(190, 50, 95, 0.40)' },
        { tip: 'rgba(255, 245, 248, 0.92)', body: 'rgba(255, 195, 208, 0.82)', base: 'rgba(200, 55, 100, 0.85)', vein: 'rgba(175, 40, 85, 0.42)' },
        { tip: 'rgba(255, 235, 242, 0.88)', body: 'rgba(248, 170, 190, 0.78)', base: 'rgba(190, 45, 90, 0.85)',  vein: 'rgba(160, 35, 75, 0.38)' }
      ];

      function createPetal(index) {
        const seed = index + 1;
        const palette = PETAL_PALETTES[index % PETAL_PALETTES.length];
        
        return {
          x: pseudoRandom(seed, 1) * width,
          y: -30 - pseudoRandom(seed, 2) * height * 0.9,
          z: 0.4 + pseudoRandom(seed, 3) * 0.6,
          size: (14 + pseudoRandom(seed, 4) * 6) * overlayScale,
          rotation: (pseudoRandom(seed, 5) - 0.5) * 0.6, // Subtle initial angle
          rotationSpeed: (pseudoRandom(seed, 6) - 0.5) * 0.25, // Gentle organic drift
          flipPhase: pseudoRandom(seed, 7) * TAU,
          flipSpeed: 0.8 + pseudoRandom(seed, 8) * 1.2, // Slow feather-like flutter
          swayPhase: pseudoRandom(seed, 9) * TAU,
          swaySpeed: 0.7 + pseudoRandom(seed, 10) * 1.1,
          swayAmplitude: 15 + pseudoRandom(seed, 11) * 25,
          fallSpeed: 18 + pseudoRandom(seed, 12) * 24, // Slow, elegant fall
          isGrounded: false,
          restAngle: (pseudoRandom(seed, 13) - 0.5) * 0.15, // Flat on ground
          palette,
          seed
        };
      }

      let petals = Array.from({ length: targetCount }, (_, i) => createPetal(i));

      function updatePetal(petal, dt) {
        const groundY = height - 36; // Taskbar top level line

        // Strong wind impulse blows grounded petals back up
        if (globalWindImpulse > 0.15 && petal.isGrounded) {
          petal.isGrounded = false;
          petal.fallSpeed = 18 + Math.random() * 20;
          petal.y = groundY - 5;
        }

        if (petal.isGrounded) {
          // Pahiga sa ground: zero bounce, zero spin, lies flat horizontally
          petal.y = groundY;
          petal.rotation = lerp(petal.rotation, petal.restAngle, dt * 6.0);
          return;
        }

        petal.swayPhase += dt * petal.swaySpeed;
        petal.flipPhase += dt * petal.flipSpeed;
        petal.rotation += petal.rotationSpeed * dt;

        const swayX = Math.sin(petal.swayPhase) * petal.swayAmplitude;
        const windX = windDirection * globalWindImpulse * 120;

        petal.x += (swayX * 0.35 + windX) * dt;
        petal.y += (petal.fallSpeed + Math.sin(petal.swayPhase * 0.5) * 4) * dt;

        // Soft ground contact: zero bounce, settles immediately flat
        if (petal.y >= groundY) {
          petal.y = groundY;
          petal.isGrounded = true;
        }

        // Wrap around off-screen bounds
        if (petal.x < -60) petal.x = width + 40;
        if (petal.x > width + 60) petal.x = -40;
      }

      // Draw Hyperrealistic Notched Sakura Cherry Blossom Petal Path
      function drawSakuraPetalPath(ctx, size) {
        ctx.beginPath();
        ctx.moveTo(0, size * 0.6); // Basal stem point
        
        // Soft left heart curve to notched tip
        ctx.bezierCurveTo(-size * 0.72, size * 0.25, -size * 0.78, -size * 0.35, -size * 0.22, -size * 0.82);
        
        // Delicate center V-notch
        ctx.lineTo(0, -size * 0.60);
        ctx.lineTo(size * 0.22, -size * 0.82);

        // Soft right heart curve back to stem
        ctx.bezierCurveTo(size * 0.78, -size * 0.35, size * 0.72, size * 0.25, 0, size * 0.6);
        ctx.closePath();
      }

      function drawPetal(petal) {
        const depthScale = 0.7 + petal.z * 0.6;
        const size = petal.size * depthScale;
        
        // Gentle 3D roll in air, completely flat (1.0) when on ground
        const flipScale = petal.isGrounded ? 1.0 : (0.75 + Math.cos(petal.flipPhase) * 0.25);

        ctx.save();
        ctx.translate(petal.x, petal.y);
        ctx.rotate(petal.rotation);
        ctx.scale(flipScale, 1.0); // Feather roll, no metallic 2D card flip

        // Soft subtle shadow underneath
        ctx.save();
        ctx.translate(1, petal.isGrounded ? 1.5 : 3);
        ctx.globalAlpha = petal.isGrounded ? 0.22 : 0.10;
        ctx.fillStyle = '#000000';
        drawSakuraPetalPath(ctx, size);
        ctx.fill();
        ctx.restore();

        // Hyperrealistic Sakura Gradient (Ivory tip -> Soft pink body -> Deep magenta base)
        const petalGrad = ctx.createLinearGradient(0, -size * 0.8, 0, size * 0.6);
        petalGrad.addColorStop(0, petal.palette.tip);
        petalGrad.addColorStop(0.55, petal.palette.body);
        petalGrad.addColorStop(1, petal.palette.base);

        ctx.fillStyle = petalGrad;
        drawSakuraPetalPath(ctx, size);
        ctx.fill();

        // Delicate outer translucent rim
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.40)';
        ctx.lineWidth = 0.5;
        ctx.stroke();

        // Central anatomical vein line
        ctx.strokeStyle = petal.palette.vein;
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(0, size * 0.55);
        ctx.bezierCurveTo(-size * 0.05, size * 0.1, 0, -size * 0.2, 0, -size * 0.45);
        ctx.stroke();

        // Basal crimson attachment spot (hyperrealism detail)
        ctx.fillStyle = 'rgba(180, 35, 75, 0.85)';
        ctx.beginPath();
        ctx.arc(0, size * 0.52, size * 0.06, 0, TAU);
        ctx.fill();

        ctx.restore();
      }

      function frame(now) {
        if (width !== innerWidth || height !== innerHeight) resize();
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        elapsed += dt;

        // 5-Minute Periodic Wind Gust Logic
        windTimer += dt;
        if (windTimer >= WIND_INTERVAL) {
          windTimer = 0;
          globalWindImpulse = 1.0;
          windDirection = (Math.random() > 0.5 ? 1 : -1);
        }

        // Decay wind impulse smoothly
        if (globalWindImpulse > 0) {
          globalWindImpulse = Math.max(0, globalWindImpulse - dt * 0.18);
        }

        ctx.clearRect(0, 0, width, height);

        for (const petal of petals) {
          updatePetal(petal, dt);
          drawPetal(petal);
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
