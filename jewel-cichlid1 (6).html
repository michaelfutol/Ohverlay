<script id="jewel-vertex" type="x-shader/x-vertex">
precision highp float;
attribute vec3 aPosition;
attribute vec3 aNormal;
attribute vec2 aUV;
uniform mat3 uRotation;
uniform vec3 uCenter;
uniform vec2 uViewport;
uniform float uScale;
uniform float uPhase;
uniform float uFinPhase;
uniform float uEffort;
uniform float uBrake;
uniform float uTurn;
uniform float uTurnBend;
uniform float uTailBend;
uniform float uRest;
uniform float uGraze;
uniform mediump float uMouth;
uniform mediump float uGill;
uniform mediump float uKind;
uniform float uSide;
uniform float uStationary;
uniform float uDrag;
varying mediump vec3 vNormal;
varying mediump vec3 vLocal;
varying mediump vec3 vSurfaceNormal;
varying mediump vec2 vUV;
varying mediump float vFront;
vec3 swivel(vec3 point,float angle){float cosine=cos(angle),sine=sin(angle);return vec3(cosine*point.x+sine*point.z,point.y,-sine*point.x+cosine*point.z);}
float bend(float position){float rear=1.0-smoothstep(-1.15,.18,position);return (1.0-uRest)*rear*rear*((.002+.115*uEffort)*sin(uPhase-position*3.5));}
float spineAngle(float distance){
 return (uTurnBend*smoothstep(0.0,1.05,distance)+uTailBend*smoothstep(.50,1.70,distance));
}
vec3 spineFrame(float distance){
 vec2 path=vec2(0.0);
 float angle=spineAngle(distance*.0694318442);path+=vec2(cos(angle),sin(angle))*.1739274226;
 angle=spineAngle(distance*.3300094782);path+=vec2(cos(angle),sin(angle))*.3260725774;
 angle=spineAngle(distance*.6699905218);path+=vec2(cos(angle),sin(angle))*.3260725774;
 angle=spineAngle(distance*.9305681558);path+=vec2(cos(angle),sin(angle))*.1739274226;
 return vec3(path*distance,spineAngle(distance));
}
void main(){
 vec3 position=aPosition,normal=aNormal;
 if(uKind>2.5&&uKind<3.5){
  // Pectoral Side Fin: Root anchor on flank behind gill
  vec3 root=vec3(.45,-.11,uSide*.228);
  float phase=uFinPhase+uSide*(1.1+uTurn*.35);
  // Stationary erection: side fins flare outward ("tatayo") when stationary or braking
  float splay=uSide*(.52*uStationary+.68*uBrake);
  float hoverFlutter=uSide*(.12+.12*uStationary+(.08+.08*(1.0-uEffort)))*sin(phase);
  // Hydrodynamic drag: fins fold backward against body as speed increases
  float dragFold=uSide*uDrag*.32;
  float stroke=splay+hoverFlutter-dragFold;
  vec3 delta=position-root;
  // Flexible drag bending along trailing edge and fin tip
  delta.x-=uDrag*.16*aUV.y*aUV.y;
  delta.z+=uSide*(.10*uStationary-.08*uDrag)*aUV.y;
  delta.y+=(aUV.x-.5)*uDrag*.04;
  float feather=.84+.16*cos(phase+.7);
  delta.y*=feather;position=root+swivel(delta,stroke);
  normal=normalize(swivel(vec3(normal.x,normal.y/feather,normal.z),stroke));
 }else if((uKind>6.5&&uKind<7.5)){
  // Pelvic fin: stands down/out when stationary, tucks back with drag
  position.z+=uSide*(.08*uBrake+.08*uStationary-.05*uDrag+.025*sin(uFinPhase*.7+uSide))*aUV.y;
  position.y-=.055*uStationary*aUV.y;
  position.x-=uDrag*.08*aUV.y;
 }else if(uKind>.5&&uKind<2.5){
  // Dorsal and anal fins: stand erect when stationary ("tatayo"), swept back by drag

// ── Jewel Cichlid Breeding & 8-Hour Lifecycle Engine ──
const BREEDING_STORAGE_KEY = 'ohverlay.cichlid.breeding.v1';
const BREEDING_CYCLE_MS = 8 * 3600 * 1000; // 8 hours (28,800,000 ms)
const BREEDING_STAGES = {
  COURTSHIP: 0,   // 0.0h - 1.0h (0.000 - 0.125)
  SPAWNING: 1,    // 1.0h - 2.5h (0.125 - 0.3125)
  EYED_EGGS: 2,   // 2.5h - 5.0h (0.3125 - 0.625)
  WRIGGLERS: 3,   // 5.0h - 6.5h (0.625 - 0.8125)
  FRY: 4          // 6.5h - 8.0h+ (0.8125 - 1.000)

const breedingState = {
  startTime: Date.now(),

  stageOverride: null,
  lastSaved: Date.now(),
  lastParentAction: 0,

  const saved = JSON.parse(localStorage.getItem(BREEDING_STORAGE_KEY));

    const elapsedReal = (Date.now() - saved.startTime) * (saved.speedMultiplier || 1.0);
    breedingState.elapsedMs = (saved.elapsedMs || 0) + elapsedReal;
    breedingState.speedMultiplier = saved.speedMultiplier || 1.0;
    breedingState.stageOverride = saved.stageOverride || null;
    breedingState.startTime = Date.now();
  }
} catch (e) {}

function saveBreedingState() {
  try {
    localStorage.setItem(BREEDING_STORAGE_KEY, JSON.stringify({
      startTime: breedingState.startTime,
      elapsedMs: breedingState.elapsedMs,
      speedMultiplier: breedingState.speedMultiplier,
      stageOverride: breedingState.stageOverride,
      lastSaved: Date.now()

  } catch (e) {}
}

function getBreedingProgress() {
  if (breedingState.stageOverride) {
    switch (String(breedingState.stageOverride).toLowerCase()) {
      case 'courtship': return 0.05;
      case 'spawning':
      case 'eggs':
      case 'egg': return 0.20;
      case 'eyed':
      case 'eyed_eggs': return 0.45;
      case 'wrigglers':
      case 'wriggler': return 0.70;
      case 'fry':
      case 'baby':
      case 'baby_fry': return 0.90;
    }

  const mod = breedingState.elapsedMs % total;
  return mod / total;

function getBreedingStage() {
  const p = getBreedingProgress();
  if (p < 0.125) return BREEDING_STAGES.COURTSHIP;
  if (p < 0.3125) return BREEDING_STAGES.SPAWNING;
  if (p < 0.625) return BREEDING_STAGES.EYED_EGGS;

{

    const theta = rng() * Math.PI * 2;
    const r = Math.sqrt(rng()) * 26.0;
    const ox = Math.cos(theta) * r * 1.15;
    const oy = Math.sin(theta) * r * 0.75;

    const rx = 3.2 + rng() * 0.6;
    const ry = 2.4 + rng() * 0.5;

  }

        breedingState.lastParentAction = now;
        breedingState.activeParentIdx = 1 - breedingState.activeParentIdx;
        const tender = breedingState.activeParentIdx === 0 ? p0 : p1;
        tender.target = { x: nest.x - 18, y: nest.y - 14, z: 8 };
        Core.fanEggs(world, tender, 4.5);
      }
    }
  }

  if (stage === BREEDING_STAGES.FRY) {
    const p0 = world.fish[0];
    const p1 = world.fish[1] || p0;
    const parentCentroid = {
      x: p0 ? (p1 ? (p0.x + p1.x) * 0.5 : p0.x) : nest.x,
      y: p0 ? (p1 ? (p0.y + p1.y) * 0.5 + 20 : p0.y + 20) : nest.y
    };

    const distToCursor = Math.hypot(cursorPos.x - parentCentroid.x, cursorPos.y - parentCentroid.y);
    const startled = distToCursor < 140;

    for (let i = 0; i < babyFry.length; i++) {
      const fry = babyFry[i];
      if (!fry.initialized) {
        fry.x = nest.x + (Math.random() - 0.5) * 30;
        fry.y = nest.y + (Math.random() - 0.5) * 30;
        fry.initialized = true;
      }

      fry.dartTimer -= delta;
      let dartBoost = 1.0;
      if (fry.dartTimer <= 0) {
        fry.dartTimer = 2.5 + Math.random() * 4.0;
        dartBoost = 1.8;
      }

      let tx, ty;
      if (startled) {
        tx = parentCentroid.x + (fry.targetOffset.x * 0.35);
        ty = parentCentroid.y + 24 + (fry.targetOffset.y * 0.25);
      } else {
        tx = parentCentroid.x + fry.targetOffset.x + Math.sin(world.visualTime * 2.0 + fry.flutterPhase) * 6.0;
        ty = parentCentroid.y + fry.targetOffset.y + Math.cos(world.visualTime * 1.6 + fry.flutterPhase) * 4.0;
      }

      const toTx = tx - fry.x;
      const toTy = ty - fry.y;
      fry.vx += toTx * (startled ? 6.0 : 3.2) * delta * dartBoost;
      fry.vy += toTy * (startled ? 6.0 : 3.2) * delta * dartBoost;

      for (let j = 0; j < babyFry.length; j++) {
        if (i === j) continue;
        const other = babyFry[j];
        const dx = fry.x - other.x, dy = fry.y - other.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 0 && dist < 12.0) {
          const repel = (12.0 - dist) / 12.0 * 25.0;
          fry.vx += (dx / dist) * repel * delta;
          fry.vy += (dy / dist) * repel * delta;
        }
      }

      const curDist = Math.hypot(fry.x - cursorPos.x, fry.y - cursorPos.y);
      if (curDist < 90.0 && curDist > 0) {
        const cFlee = (90.0 - curDist) / 90.0 * 75.0;
        fry.vx += ((fry.x - cursorPos.x) / curDist) * cFlee * delta;
        fry.vy += ((fry.y - cursorPos.y) / curDist) * cFlee * delta;
      }

      fry.vx *= Math.pow(0.25, delta);
      fry.vy *= Math.pow(0.25, delta);

      fry.x += fry.vx * delta;
      fry.y += fry.vy * delta;

      const speed = Math.hypot(fry.vx, fry.vy);
      if (speed > 1.2) {
        fry.yaw = Math.atan2(fry.vy, fry.vx);
      }
    }
  }
}

function drawFry(ctx, fry, visualTime, opacity) {
  ctx.save();
  ctx.translate(fry.x, fry.y);
  ctx.rotate(fry.yaw);
  ctx.globalAlpha = opacity * 0.95;

  const len = fry.size;
  const h = len * 0.50;

  const bodyGrad = ctx.createLinearGradient(-len * 0.5, 0, len * 0.5, 0);
  bodyGrad.addColorStop(0, '#f97316');
  bodyGrad.addColorStop(0.5, '#ef4444');
  bodyGrad.addColorStop(1, '#b91c1c');

  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(len * 0.5, 0);
  ctx.quadraticCurveTo(len * 0.1, -h, -len * 0.4, -h * 0.5);
  ctx.lineTo(-len * 0.5, 0);
  ctx.lineTo(-len * 0.4, h * 0.5);
  ctx.quadraticCurveTo(len * 0.1, h, len * 0.5, 0);
  ctx.fill();

  ctx.fillStyle = 'rgba(254, 240, 138, 0.5)';
  ctx.beginPath();
  ctx.ellipse(len * 0.05, h * 0.2, len * 0.25, h * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();

  const spark = 0.5 + 0.5 * Math.sin(visualTime * 6.0 + fry.sparkPhase);
  ctx.fillStyle = `rgba(103, 232, 249, ${0.6 + 0.4 * spark})`;
  ctx.beginPath();
  ctx.arc(-len * 0.05, -h * 0.1, 0.7, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(len * 0.32, -h * 0.15, 0.75, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(len * 0.36, -h * 0.22, 0.3, 0, Math.PI * 2);
  ctx.fill();

  const tailFlutter = Math.sin(visualTime * 24.0 + fry.flutterPhase) * 1.2;
  ctx.fillStyle = 'rgba(253, 186, 116, 0.65)';
  ctx.beginPath();
  ctx.moveTo(-len * 0.45, 0);
  ctx.lineTo(-len * 0.85, -h * 0.7 + tailFlutter * 0.5);
  ctx.lineTo(-len * 0.75, 0);
  ctx.lineTo(-len * 0.85, h * 0.7 + tailFlutter * 0.5);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawEggClump(ctx, nest, stage, visualTime, opacity) {
  ctx.save();
  ctx.translate(nest.x, nest.y);
  ctx.globalAlpha = opacity;

  ctx.strokeStyle = 'rgba(234, 179, 8, 0.25)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  for (let i = 0; i < eggOffsets.length; i += 3) {
    const e = eggOffsets[i];
    const nextE = eggOffsets[(i + 1) % eggOffsets.length];
    ctx.moveTo(e.ox, e.oy);
    ctx.quadraticCurveTo((e.ox + nextE.ox) * 0.5 + 2, (e.oy + nextE.oy) * 0.5 - 2, nextE.ox, nextE.oy);
  }
  ctx.stroke();

  for (let i = 0; i < eggOffsets.length; i++) {
    const egg = eggOffsets[i];
    ctx.save();
    ctx.translate(egg.ox, egg.oy);
    ctx.rotate(egg.tilt);

    const eggGrad = ctx.createRadialGradient(-egg.rx * 0.3, -egg.ry * 0.3, 0.5, 0, 0, egg.rx);
    eggGrad.addColorStop(0, '#fef08a');
    eggGrad.addColorStop(0.4, '#f59e0b');
    eggGrad.addColorStop(0.85, '#d97706');
    eggGrad.addColorStop(1, 'rgba(180, 83, 9, 0.75)');

    ctx.fillStyle = eggGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, egg.rx, egg.ry, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
    ctx.beginPath();
    ctx.ellipse(-egg.rx * 0.35, -egg.ry * 0.35, egg.rx * 0.28, egg.ry * 0.22, -0.4, 0, Math.PI * 2);
    ctx.fill();

    if (stage === BREEDING_STAGES.EYED_EGGS) {
      ctx.fillStyle = '#1c1917';
      ctx.beginPath();
      ctx.arc(-0.7, 0.2, 0.65, 0, Math.PI * 2);
      ctx.arc(0.7, 0.2, 0.65, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-0.55, 0.05, 0.25, 0, Math.PI * 2);
      ctx.arc(0.85, 0.05, 0.25, 0, Math.PI * 2);
      ctx.fill();
    }

    if (stage === BREEDING_STAGES.WRIGGLERS) {
      ctx.fillStyle = 'rgba(245, 158, 11, 0.85)';
      ctx.beginPath();
      ctx.arc(0, 0, egg.rx * 0.6, 0, Math.PI * 2);
      ctx.fill();

      const wiggle = Math.sin(visualTime * 26.0 + egg.tailPhase) * 2.2;
      const tailDir = egg.eyeAngle + Math.PI * 0.5;
      const tx = Math.cos(tailDir) * egg.tailLength;
      const ty = Math.sin(tailDir) * egg.tailLength;

      ctx.strokeStyle = 'rgba(254, 215, 170, 0.85)';
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(tx * 0.5 + wiggle, ty * 0.5 - wiggle * 0.5, tx + wiggle * 1.2, ty);
      ctx.stroke();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(0.2, -0.2, 0.6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  ctx.restore();
}

function drawBreeding(ctxGround, ctxDust) {
  const stage = getBreedingStage();
  const nest = getNestLocation();
  const opacity = ui.opacity;

  if (stage === BREEDING_STAGES.COURTSHIP) {
    ctxDust.save();
    ctxDust.globalAlpha = opacity * 0.45;
    ctxDust.fillStyle = '#fde68a';
    for (let i = 0; i < 6; i++) {
      const sparkX = nest.x + Math.sin(world.visualTime * 3.0 + i) * 16.0;
      const sparkY = nest.y + Math.cos(world.visualTime * 2.5 + i * 2) * 12.0;
      ctxDust.fillRect(sparkX, sparkY, 1.5, 1.5);
    }
    ctxDust.restore();
  }

  if (stage === BREEDING_STAGES.SPAWNING || stage === BREEDING_STAGES.EYED_EGGS || stage === BREEDING_STAGES.WRIGGLERS) {
    drawEggClump(ctxGround, nest, stage, world.visualTime, opacity);
  }

  if (stage === BREEDING_STAGES.FRY) {
    for (let i = 0; i < babyFry.length; i++) {
      drawFry(ctxGround, babyFry[i], world.visualTime, opacity);
    }
  }
}

on('bubbles','change',event=>{world.bubbleEnabled=event.target.checked;if(!world.bubbleEnabled)world.bubbles=[];draw();});
on('hornwort','change',event=>{ui.hornwort=event.target.checked;refreshObjects();draw();updateUI();});
on('dig','click',()=>{if(canAct())Core.request(world,'dig');updateUI();});
on('home','click',()=>{if(canAct())Core.request(world,'home');updateUI();});
on('intruder','click',()=>{if(canAct())Core.intrude(world);updateUI();});
on('move','click',()=>{if(canAct())ui.relocating=!ui.relocating;updateUI();});
function point(event){const box=canvas.getBoundingClientRect();return {x:(event.clientX-box.left)*world.width/box.width,y:(event.clientY-box.top)*world.height/box.height,z:0};}
canvas.addEventListener('pointerdown',event=>{
 if(!canAct()||(event.button!==undefined&&event.button!==0))return;const destination=point(event);
 if(ui.relocating){Core.moveHome(world,destination);ui.relocating=false;}
 else if(!Core.poke(world,destination))Core.request(world,'explore',destination);
 updateUI();draw();
});
canvas.addEventListener('keydown',event=>{
 if(!canAct())return;const offsets={ArrowLeft:[-70,0],ArrowRight:[70,0],ArrowUp:[0,-60],ArrowDown:[0,60]};
 if(offsets[event.key]){event.preventDefault();const offset=offsets[event.key],origin=ui.relocating?world.home:world.fish[0];const destination={x:origin.x+offset[0],y:origin.y+offset[1],z:0};if(ui.relocating){Core.moveHome(world,destination);ui.relocating=false;}else Core.explore(world,world.fish[0],destination);}
 if(event.key==='Home'){event.preventDefault();Core.request(world,'home');}updateUI();
});
function setSetting(id,raw){
 const parsed=Number(raw);if(!Number.isFinite(parsed))return;
 const limits={size:[40,160],speed:[0,1.5],radius:[60,160],jewels:[0,150],detail:[0,100],light:[-90,90],angle:[-180,180],opacity:[0,100]};
 const range=limits[id];if(!range)return;
 const value=Math.max(range[0],Math.min(range[1],parsed));setVal(id,value);
 if(['size','speed','radius'].includes(id))Core.setting(world,id,value);else ui[id]=['jewels','detail','opacity'].includes(id)?value/100:value;
 setText(id+'-value',id==='speed'?value.toFixed(1)+'×':['light','angle'].includes(id)?value+'°':value+'%');updateUI();draw();
}
for(const id of ['size','speed','radius','jewels','detail','light','angle','opacity'])on(id,'input',event=>setSetting(id,event.target.value));
on('ambient','change',event=>{world.ambient=event.target.checked;});
for(const [id,key] of [['habitat-toggle','showHabitat'],['territory','showTerritory'],['spot','spot']])on(id,'change',event=>{ui[key]=event.target.checked;draw();});
on('background','click',()=>{const enabled=root.classList.toggle('transparent');setAttr('background','aria-pressed',String(enabled));});
on('hide','click',()=>hide(true));on('restore','click',()=>hide(false));
document.addEventListener('keydown',event=>{if(event.key==='Escape'){ui.relocating=false;if(ui.hidden)hide(false);updateUI();}});
window.addEventListener('pointermove', e => { cursorPos.x = e.clientX; cursorPos.y = e.clientY; });
document.addEventListener('visibilitychange',sync);window.addEventListener('resize',measure);
const onPreference=event=>{ui.paused=event.matches;sync();};if(media.addEventListener)media.addEventListener('change',onPreference);else if(media.addListener)media.addListener(onPreference);
canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();ui.lost=true;ui.ready=false;gpu=null;get('error').hidden=false;get('error-message').textContent='Graphics context lost. Waiting for browser restoration.';get('retry').disabled=true;sync();});
canvas.addEventListener('webglcontextrestored',()=>{ui.lost=false;initialize();});get('retry').addEventListener('click',initialize);

window.setBreedingSpeed = speed => {
  const val = Number(speed);
  if (Number.isFinite(val) && val > 0) {
    breedingState.speedMultiplier = val;
    saveBreedingState();
  }
  return { speedMultiplier: breedingState.speedMultiplier };
};

window.setBreedingStage = stageName => {
  if (stageName === 'auto' || stageName === 'reset' || stageName === null || stageName === undefined) {
    breedingState.stageOverride = null;
  } else {
    breedingState.stageOverride = String(stageName).toLowerCase();
  }
  if (world.fish.length < 2) {
    window.togglePair();
  }
  saveBreedingState();
  return window.getBreedingState();
};

window.resetBreeding = () => {
  breedingState.elapsedMs = 0;
  breedingState.stageOverride = null;
  breedingState.startTime = Date.now();
  saveBreedingState();
  return window.getBreedingState();
};

window.getBreedingState = () => {
  const stage = getBreedingStage();
  const stageNames = ['Courtship & Cleaning', 'Spawning & Egg Clump', 'Eyed Eggs & Incubation', 'Wrigglers', 'Free-Swimming Baby Fry'];
  return {
    stage,
    stageName: stageNames[stage] || 'Unknown',
    progress: getBreedingProgress(),
    elapsedHours: (breedingState.elapsedMs % BREEDING_CYCLE_MS) / (3600 * 1000),
    speedMultiplier: breedingState.speedMultiplier,
    stageOverride: breedingState.stageOverride,
    eggCount: EGG_COUNT,
    fryCount: FRY_COUNT
  };
};

window.JewelCichlidOverlay=Object.freeze({version:1,setObjects(input){
 const copied=JSON.parse(JSON.stringify(input));Core.setObjects(world,[...copied,...(ui.hornwort?[demoSnapshot()]:[])]);hostObjects=copied;draw();updateUI();
},snapshot(){return {version:1,time:world.time,viewport:{width:world.width,height:world.height},fish:world.fish.map(agent=>({id:agent.id,name:agent.identity[0],mode:agent.mode,x:agent.x,y:agent.y,yaw:agent.yaw})),contacts:world.contacts.map(event=>({...event}))};}});

// Live control hooks for Ohverlay desktop integration
window.setCount = v => {
  if (ui.study) return;
  const val = Number(v);
  if (Number.isFinite(val)) {
    Core.count(world, val);
    if (get('count')) get('count').value = String(world.count);
    if (get('count-value')) get('count-value').textContent = String(world.count);
    sync();
  }
};

window.setScale = v => {
  const val = Number(v);
  if (Number.isFinite(val)) {
    setSetting('size', val * 100);
  }
};

window.setSize = v => {
  setSetting('size', v);
};

window.setOpacity = v => {
  const val = Number(v);
  if (Number.isFinite(val)) {
    const op = val <= 1.0 ? val * 100 : val;
    setSetting('opacity', op);
  }
};

window.setTransparency = pct => {
  const val = Number(pct);
  if (Number.isFinite(val)) {
    window.setOpacity(Math.max(0, Math.min(1, 1.0 - (val / 100.0))));
  }
};

window.setSpeed = v => {
  setSetting('speed', v);
};

window.dart = () => {
  if (canAct()) Core.request(world, 'dart');
  updateUI();
};

window.turn = () => {
  if (canAct()) Core.request(world, 'turn');
  updateUI();
};

window.dig = () => {
  if (canAct()) Core.request(world, 'dig');
  updateUI();
};

window.graze = () => {
  if (canAct()) Core.request(world, 'graze');
  updateUI();
};

window.cruise = () => {
  if (canAct()) Core.request(world, 'explore');
  updateUI();
};

window.emitBubble = () => {
  if (world && world.fish && world.fish[0]) {
    world.fish[0].nextBubble = 0;
    world.fish[0].mouth = 0.85;
  }
};

window.returnHome = () => {
  if (canAct()) Core.request(world, 'home');
  updateUI();
};

window.frontView = () => {
  if (!ui.ready || !world.fish.length) return;
  const primary = world.fish[0];
  if (primary.mode === 'INSPECT') {
    Core.explore(world, primary);
  } else {
    Core.inspectFront(world, primary, 4.5);
  }
};

window.toggleStudy = () => {
  window.frontView();
};

window.togglePair = () => {
  Core.pair(world, !world.paired);
  setVal('count', world.count);
  setText('count-value', world.count);
  sync();
};

window.toggleControls = show => {
  const isHidden = root.classList.contains('hidden-ui');
  hide(show !== undefined ? !show : !isHidden);
};

// Desktop cursor reactivity
let lastCursorPoke = 0;
window.__onCursorMove = (x, y) => {
  cursorPos.x = x; cursorPos.y = y;
  if (!canAct()) return;
  const now = performance.now();
  const dest = {x, y, z: 0};
  for (const agent of world.fish) {
    const dist = Math.hypot(x - agent.x, y - agent.y);
    const fishScale = Core.scale(world, agent);
    if (dist < fishScale * 1.2 && now - lastCursorPoke > 1200) {
      lastCursorPoke = now;
      Core.poke(world, dest);
      updateUI();
      draw();
      break;
    }
  }
};

window.__onCursorLeave = () => {
  cursorPos.x = -9999; cursorPos.y = -9999;
  // Cursor left the window bounds
};

measure();if(query.has('count')){const value=Number(query.get('count'));if(Number.isFinite(value))Core.count(world,value);}if(query.get('pair')==='1')Core.pair(world,true);setVal('count',world.count);setText('count-value',world.count);if(query.get('ambient')==='off'){world.ambient=false;setChecked('ambient',false);}
for(const id of ['size','speed','radius','jewels','detail','light','angle'])if(query.has(id))setSetting(id,query.get(id));
if(query.has('opacity')){const rawOp=Number(query.get('opacity'));if(Number.isFinite(rawOp)){const opVal=rawOp<=1.0?rawOp*100:rawOp;setSetting('opacity',opVal);}}
if(query.has('transparency')){const rawTr=Number(query.get('transparency'));if(Number.isFinite(rawTr))window.setTransparency(rawTr);}
if(query.has('scale')){const s=Number(query.get('scale'));if(Number.isFinite(s))setSetting('size',s*100);}
if(query.get('transparent')==='1'){root.classList.add('transparent');setAttr('background','aria-pressed','true');}
if(query.has('breeding_stage'))window.setBreedingStage(query.get('breeding_stage'));if(query.has('breeding_speed'))window.setBreedingSpeed(query.get('breeding_speed'));if(query.get('study')==='1')window.frontView();if(query.get('controls')==='0')hide(true);initialize();
})();
</script>
</body>
</html>
